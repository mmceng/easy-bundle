name: Deploy DAB to Databricks

on:
  push:
    branches:
      - dev
      - qa
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Databricks CLI via official action
        uses: databricks/setup-cli@main

      - name: Verify Databricks CLI version
        run: databricks --version

      - name: Determine deployment target
        id: target
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          case "$BRANCH" in
            dev)   echo "target=dev"   ;;
            qa)    echo "target=qa"    ;;
            prod)  echo "target=prod"  ;;
            *)     echo "Unsupported branch: $BRANCH" && exit 1 ;;
          esac >> $GITHUB_OUTPUT

      - name: Deploy Databricks Asset Bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate --target ${{ steps.target.outputs.target }}
          databricks bundle deploy   --target ${{ steps.target.outputs.target }}
